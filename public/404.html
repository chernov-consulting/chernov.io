<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Chernov</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0E12" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link href="/stylesheets/site.css?v=20261104" rel="stylesheet">
    <style>
        .lost { position: relative; min-height: 100svh; display: grid; align-content: center; gap: 24px; padding: 48px max(24px, calc((100% - 1200px) / 2)); background: var(--ink); color: var(--on-ink); overflow: hidden; isolation: isolate; }
        .lost::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--line-ink) 1px, transparent 1px), linear-gradient(90deg, var(--line-ink) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask: radial-gradient(60% 60% at 70% 40%, #000, transparent 75%); mask: radial-gradient(60% 60% at 70% 40%, #000, transparent 75%); }
        .lost h1 { font: 600 clamp(48px, 9vw, 120px)/.95 var(--display); letter-spacing: -.045em; }
        .lost h1 em { color: var(--accent-glow); }
        .lost p { max-width: 460px; margin: 0; font-size: 18px; color: var(--on-ink-2); }
        .lost .btn { justify-self: start; }
    </style>
</head>
<body>
    <main class="lost">
        <p class="label label-accent">404</p>
        <h1>This page <em>didn't ship.</em></h1>
        <p>The link may be old, or the page has moved. Everything that matters is one click away.</p>
        <a class="btn btn-accent" href="/">Back to chernov.io</a>
    </main>
</body>
</html>
